name: Validate Zeek package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: Validate on Zeek ${{ matrix.zeek }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - zeek: '9.0.0'
            image: zeek/zeek@sha256:70733f4e540ba1608e37e00c6a93d009f79734262c9ec2ba09d90aa9abc16de5
          - zeek: '9.0.1'
            image: zeek/zeek@sha256:524cb0ce29f26a6a954fb9c357a8f92b95812476d8240f0ece26617ace249dd0
    steps:
      - uses: actions/checkout@v4
      - name: Verify file checksums
        run: sha256sum --check SHA256SUMS
      - name: Run package tests and authentic/event replays
        run: >-
          docker run --rm --network none --cpus 1 --memory 1g
          -v "$PWD:/package:ro" --workdir /package --entrypoint /bin/sh
          ${{ matrix.image }} -ec
          'test "$(zeek --version)" = "zeek version $1";
          exec python3 -B -m unittest discover -s tests -v'
          sh '${{ matrix.zeek }}'
