name: Validate Zeek package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify file checksums
        run: sha256sum --check SHA256SUMS
      - name: Run package tests and authentic/event replays
        run: >-
          docker run --rm --network none --cpus 1 --memory 1g
          -v "$PWD:/package:ro" --workdir /package --entrypoint python3
          zeek/zeek@sha256:70733f4e540ba1608e37e00c6a93d009f79734262c9ec2ba09d90aa9abc16de5
          -B -m unittest discover -s tests -v
